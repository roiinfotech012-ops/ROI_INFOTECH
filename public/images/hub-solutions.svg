<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" fill="none">
  <defs>
    <linearGradient id="bgSol" x1="0" y1="0" x2="800" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F5F3FF"/>
      <stop offset="100%" stop-color="#DBEAFE"/>
    </linearGradient>
    <linearGradient id="solBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#171D68"/>
      <stop offset="50%" stop-color="#0D55A5"/>
      <stop offset="100%" stop-color="#008AD8"/>
    </linearGradient>
    <linearGradient id="solViolet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4F2BFF"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <filter id="solShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#171D68" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect width="800" height="520" rx="32" fill="url(#bgSol)"/>
  <circle cx="400" cy="260" r="210" fill="#4F2BFF" fill-opacity="0.06"/>

  <!-- Central Enterprise Hub Core -->
  <g filter="url(#solShadow)">
    <rect x="260" y="130" width="280" height="260" rx="28" fill="#FFFFFF"/>
    <rect x="285" y="155" width="230" height="84" rx="16" fill="url(#solBlue)"/>
    <circle cx="325" cy="197" r="20" fill="#FFFFFF" fill-opacity="0.22"/>
    <path d="M316 197L323 204L336 190" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="358" y="182" width="125" height="11" rx="5.5" fill="#FFFFFF"/>
    <rect x="358" y="202" width="88" height="8" rx="4" fill="#BAE6FD"/>

    <!-- 4 Modular Solution Tiles Inside Dashboard -->
    <rect x="285" y="255" width="108" height="52" rx="12" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.5"/>
    <circle cx="308" cy="281" r="10" fill="#0D55A5"/>
    <rect x="326" y="274" width="52" height="7" rx="3.5" fill="#1E293B"/>
    <rect x="326" y="286" width="36" height="5" rx="2.5" fill="#64748B"/>

    <rect x="407" y="255" width="108" height="52" rx="12" fill="#F5F3FF" stroke="#DDD6FE" stroke-width="1.5"/>
    <circle cx="430" cy="281" r="10" fill="#4F2BFF"/>
    <rect x="448" y="274" width="52" height="7" rx="3.5" fill="#1E293B"/>
    <rect x="448" y="286" width="36" height="5" rx="2.5" fill="#64748B"/>

    <rect x="285" y="319" width="108" height="52" rx="12" fill="#F0F9FF" stroke="#BAE6FD" stroke-width="1.5"/>
    <circle cx="308" cy="345" r="10" fill="#008AD8"/>
    <rect x="326" y="338" width="52" height="7" rx="3.5" fill="#1E293B"/>
    <rect x="326" y="350" width="36" height="5" rx="2.5" fill="#64748B"/>

    <rect x="407" y="319" width="108" height="52" rx="12" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1.5"/>
    <circle cx="430" cy="345" r="10" fill="#171D68"/>
    <rect x="448" y="338" width="52" height="7" rx="3.5" fill="#1E293B"/>
    <rect x="448" y="350" width="36" height="5" rx="2.5" fill="#64748B"/>
  </g>

  <!-- Connecting Lines to 4 Industry Solution Nodes -->
  <path d="M260 190H170M260 330H170M540 190H630M540 330H630" stroke="#4F2BFF" stroke-width="3" stroke-dasharray="8 6" stroke-opacity="0.5"/>

  <!-- Left Top Node (Food Delivery / Commerce) -->
  <g filter="url(#solShadow)">
    <rect x="55" y="135" width="125" height="105" rx="22" fill="url(#solViolet)"/>
    <circle cx="117" cy="176" r="22" fill="#FFFFFF" fill-opacity="0.22"/>
    <rect x="85" y="210" width="64" height="8" rx="4" fill="#FFFFFF"/>
  </g>

  <!-- Left Bottom Node (Real Estate) -->
  <g filter="url(#solShadow)">
    <rect x="55" y="280" width="125" height="105" rx="22" fill="#FFFFFF"/>
    <path d="M97 332L117 314L137 332V354H97V332Z" fill="url(#solBlue)"/>
    <rect x="82" y="364" width="70" height="7" rx="3.5" fill="#1E293B"/>
  </g>

  <!-- Right Top Node (LMS Platform) -->
  <g filter="url(#solShadow)">
    <rect x="620" y="135" width="125" height="105" rx="22" fill="#FFFFFF"/>
    <rect x="652" y="164" width="60" height="42" rx="10" fill="url(#solBlue)"/>
    <rect x="646" y="216" width="72" height="8" rx="4" fill="#1E293B"/>
  </g>

  <!-- Right Bottom Node (eCommerce Cart) -->
  <g filter="url(#solShadow)">
    <rect x="620" y="280" width="125" height="105" rx="22" fill="url(#solBlue)"/>
    <circle cx="682" cy="322" r="22" fill="#FFFFFF" fill-opacity="0.22"/>
    <rect x="648" y="356" width="68" height="8" rx="4" fill="#FFFFFF"/>
  </g>
</svg>
