<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" fill="none">
  <defs>
    <linearGradient id="bgMkt" x1="0" y1="0" x2="800" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#EFF6FF"/>
      <stop offset="100%" stop-color="#EDE9FE"/>
    </linearGradient>
    <linearGradient id="mktBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#171D68"/>
      <stop offset="50%" stop-color="#0D55A5"/>
      <stop offset="100%" stop-color="#008AD8"/>
    </linearGradient>
    <linearGradient id="mktViolet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4F2BFF"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <filter id="mktShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#171D68" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect width="800" height="520" rx="32" fill="url(#bgMkt)"/>
  <circle cx="640" cy="140" r="150" fill="#008AD8" fill-opacity="0.1"/>
  <circle cx="160" cy="390" r="130" fill="#4F2BFF" fill-opacity="0.08"/>

  <!-- Main Analytics & SEO Growth Dashboard -->
  <g filter="url(#mktShadow)">
    <rect x="85" y="95" width="490" height="330" rx="26" fill="#FFFFFF"/>
    <rect x="115" y="125" width="210" height="24" rx="12" fill="#EFF6FF"/>
    <circle cx="133" cy="137" r="6" fill="#0D55A5"/>
    <rect x="148" y="133" width="120" height="8" rx="4" fill="#1E293B"/>

    <!-- Growth Metric Pill -->
    <rect x="435" y="123" width="110" height="28" rx="14" fill="url(#mktViolet)"/>
    <rect x="458" y="133" width="64" height="8" rx="4" fill="#FFFFFF"/>

    <!-- Rising Bar Chart -->
    <rect x="115" y="175" width="430" height="175" rx="18" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>
    <rect x="145" y="275" width="38" height="55" rx="8" fill="#BFDBFE"/>
    <rect x="203" y="250" width="38" height="80" rx="8" fill="#93C5FD"/>
    <rect x="261" y="228" width="38" height="102" rx="8" fill="#60A5FA"/>
    <rect x="319" y="210" width="38" height="120" rx="8" fill="#3B82F6"/>
    <rect x="377" y="195" width="38" height="135" rx="8" fill="#0D55A5"/>
    <rect x="435" y="185" width="38" height="145" rx="8" fill="url(#mktViolet)"/>
    <rect x="493" y="170" width="38" height="160" rx="8" fill="url(#mktBlue)"/>

    <!-- Trend Line -->
    <path d="M164 265L222 240L280 218L338 200L396 184L454 174L512 158" stroke="#4F2BFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="512" cy="158" r="8" fill="#FFFFFF" stroke="#4F2BFF" stroke-width="4"/>

    <!-- Bottom Channel Pills (SEO, PPC, SMM, Local) -->
    <rect x="115" y="368" width="96" height="34" rx="10" fill="#EFF6FF"/>
    <rect x="132" y="381" width="62" height="8" rx="4" fill="#0D55A5"/>
    <rect x="226" y="368" width="96" height="34" rx="10" fill="#F5F3FF"/>
    <rect x="243" y="381" width="62" height="8" rx="4" fill="#4F2BFF"/>
    <rect x="337" y="368" width="96" height="34" rx="10" fill="#F0F9FF"/>
    <rect x="354" y="381" width="62" height="8" rx="4" fill="#008AD8"/>
    <rect x="448" y="368" width="96" height="34" rx="10" fill="#EEF2FF"/>
    <rect x="465" y="381" width="62" height="8" rx="4" fill="#171D68"/>
  </g>

  <!-- Floating Search / SEO Target Card -->
  <g filter="url(#mktShadow)">
    <rect x="530" y="140" width="195" height="145" rx="24" fill="url(#mktBlue)"/>
    <circle cx="627" cy="198" r="32" stroke="#FFFFFF" stroke-width="6" fill="none"/>
    <path d="M650 221L670 241" stroke="#38BDF8" stroke-width="7" stroke-linecap="round"/>
    <circle cx="627" cy="198" r="12" fill="#38BDF8"/>
    <rect x="572" y="252" width="110" height="8" rx="4" fill="#FFFFFF" fill-opacity="0.9"/>
  </g>

  <!-- Floating Conversion Ring Card -->
  <g filter="url(#mktShadow)">
    <rect x="550" y="310" width="175" height="125" rx="24" fill="#FFFFFF"/>
    <circle cx="605" cy="372" r="30" stroke="#E2E8F0" stroke-width="8" fill="none"/>
    <path d="M605 342A30 30 0 1 1 577 383" stroke="url(#mktViolet)" stroke-width="8" stroke-linecap="round" fill="none"/>
    <rect x="650" y="356" width="54" height="10" rx="5" fill="#0F172A"/>
    <rect x="650" y="376" width="40" height="8" rx="4" fill="#4F2BFF"/>
  </g>
</svg>
